version: '3.8'

services:
  api:
    build:
      context: ./docker/api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      - redis

  app:
    build:
      context: ./docker/app
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    depends_on:
      - api

  redis:
    image: "redis:alpine"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
